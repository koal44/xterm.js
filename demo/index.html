<!doctype html>
<html>
  <head>
    <title>xterm.js demo</title>
    <!--
      WARNING: This demo is a barebones implementation designed for development and evaluation
      purposes only. It is definitely NOT production ready and does not aim to be so. Exposing the
      demo to the public as is would introduce security risks for the host.
    -->
    <link rel="shortcut icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/xterm.css" />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="banner">
      <span class="banner-title">xterm.js</span>


      <div id="dev-inject">
        <div class="dev-group" title="Socket trace">
          <button class="dev-btn dev-btn-text" data-trace="start" title="Clear + start socket trace">trace start</button>
          <button class="dev-btn dev-btn-text" data-trace="log" title="Dump trace to console">trace log</button>
        </div>
        <span class="dev-sep" aria-hidden="true">|</span>
        <div class="dev-group" title="Inject test strings (typed, not pasted)">
          <button class="dev-btn" data-inject="ABC🙂" title="ABC🙂">🙂</button>
          <button class="dev-btn" data-inject="ABC👨‍🌾" title="ABC👨‍🌾">👨‍🌾</button>
          <button class="dev-btn" data-inject="ABC👨‍👩‍👧‍👦" title="ABC👨‍👩‍👧‍👦">👨‍👩‍👧‍👦</button>
          <button class="dev-btn" data-inject="ABC🇺🇳" title="ABC🇺🇳">🇺🇳</button>
        </div>
        <span class="dev-sep" aria-hidden="true">|</span>

        <div class="dev-group" title="Shell/profile mapping for key sequences">
          <label class="dev-label" for="dev-shell">shell</label>
          <select id="dev-shell" class="dev-select" title="Select shell/editor profile">
            <option value="bash">bash / readline</option>
            <option value="zsh">zsh / zle</option>
            <option value="fish">fish</option>
            <option value="powershell">PowerShell / PSReadLine</option>
          </select>
        </div>

        <div class="dev-group" title="Key ops (stdin)">
          <!-- DEL bursts -->
          <div class="dev-group" title="Send DEL (0x7F) burst">
            <input
              id="dev-del-n" class="dev-num"
              type="number"
              min="1" max="64"
              step="1" value="1"
              inputmode="numeric"
              title="DEL repeat count"
            />
            <button class="dev-btn dev-btn-text" data-del="1" title="Send DEL × N">DEL</button>
          </div>

          <button class="dev-btn dev-btn-text" data-action="clear" title="Clear line">CLEAR</button>
          <span class="dev-sep" aria-hidden="true">|</span>
          <button class="dev-btn dev-btn-text" data-action="left" title="Left">←</button>
          <button class="dev-btn dev-btn-text" data-action="right" title="Right">→</button>
          <button class="dev-btn dev-btn-text" data-action="home" title="Home">HOME</button>
          <button class="dev-btn dev-btn-text" data-action="end" title="End">END</button>

        </div>

      </div>

      <style>
        /* dev-only; feel free to move to index.css */
        #dev-inject {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          margin-left: 10px;
          user-select: none;
        }
        #dev-inject .dev-group { display: inline-flex; gap: 6px; align-items: center; }
        #dev-inject .dev-sep { opacity: 0.5; }
        #dev-inject .dev-btn {
          font: inherit;
          line-height: 1;
          padding: 2px 6px;
          border-radius: 6px;
          border: 1px solid rgba(255,255,255,0.25);
          background: rgba(255,255,255,0.06);
          color: inherit;
          cursor: pointer;
        }
        #dev-inject .dev-btn:hover { background: rgba(255,255,255,0.12); }
        #dev-inject .dev-btn:active { transform: translateY(1px); }
        #dev-inject .dev-btn-text { font-size: 12px; padding: 3px 7px; }

        #dev-inject .dev-num{
          width: 52px;
          font: inherit;
          font-size: 12px;
          line-height: 1;
          padding: 2px 6px;
          border-radius: 6px;
          border: 1px solid rgba(255,255,255,0.25);
          background: rgba(255,255,255,0.06);
          color: inherit;
          outline: none;
        }
        #dev-inject .dev-num:focus{
          border-color: rgba(255,255,255,0.45);
          background: rgba(255,255,255,0.10);
        }

        #dev-inject .dev-label {
          font-size: 12px;
          opacity: 0.8;
          margin-right: 4px;
        }

        #dev-inject .dev-select {
          font: inherit;
          font-size: 12px;
          line-height: 1;
          padding: 2px 6px;
          border-radius: 6px;
          border: 1px solid rgba(255,255,255,0.25);
          background: rgba(255,255,255,0.06);
          color: inherit;
          outline: none;
        }
        #dev-inject .dev-select:focus {
          border-color: rgba(255,255,255,0.45);
          background: rgba(255,255,255,0.10);
        }

      </style>

      <script>
        (function () {
          function getTerm() {
            // You said window.term exists; keep this flexible.
            return window.term || window._term || null;
          }

          const SHELL_PROFILES = {
            // bash/readline: CSI arrows typically fine; home/end often CSI H/F but can vary.
            bash: {
              clear: "\x15",         // Ctrl+U
              left: "\x1b[D",        // CSI D
              right: "\x1b[C",       // CSI C
              home: "\x1b[H",        // CSI H
              end: "\x1b[F",         // CSI F
            },

            // zsh/zle: often prefers SS3 home/end in app-cursor contexts; keep CSI arrows.
            zsh: {
              clear: "\x15",
              left: "\x1b[D",
              right: "\x1b[C",
              home: "\x1bOH",        // SS3 Home (fixes your BEL \x07 issue most likely)
              end: "\x1bOF",         // SS3 End
            },

            // fish: tends to accept CSI arrows; home/end vary, but SS3 often works in app mode too.
            fish: {
              clear: "\x15",
              left: "\x1b[D",
              right: "\x1b[C",
              home: "\x1bOH",
              end: "\x1bOF",
            },

            // PSReadLine: kill via Ctrl+U is not reliable; prefer ESC (revert line) or Ctrl+U if you confirm.
            // Based on your earlier experience: HOME/END as CSI H/F worked.
            powershell: {
              clear: "\x1b",          // ESC (PSReadLine revert line) — keep as profile-specific
              left: "\x1b[D",
              right: "\x1b[C",
              home: "\x1b[H",
              end: "\x1b[F",
            },
          };

          let currentShell = "bash";
          let currentProfile = SHELL_PROFILES[currentShell];

          function setShellProfile(name) {
            const p = SHELL_PROFILES[name];
            if (!p) {
              console.warn(`[dev] unknown shell profile: ${name}`);
              return;
            }
            currentShell = name;
            currentProfile = p;
            // Optional debug:
            console.log(`[dev] shell profile = ${name}`);
          }

          function initShellProfileFromUI() {
            const sel = document.getElementById("dev-shell");
            if (!sel) {
              // No dropdown in DOM; keep defaults.
              return;
            }
            // If you want a different default, set <option selected> in HTML.
            setShellProfile(sel.value || "bash");

            sel.addEventListener("change", () => {
              setShellProfile(sel.value);
            });
          }

          function unescapeBytes(s) {
            // Supports \xHH, \uHHHH, \n, \r, \t, \\.
            return s.replace(
              /\\x([0-9a-fA-F]{2})|\\u([0-9a-fA-F]{4})|\\n|\\r|\\t|\\\\/g,
              (m, hx, hu) => {
                if (hx) return String.fromCharCode(parseInt(hx, 16));
                if (hu) return String.fromCharCode(parseInt(hu, 16));
                if (m === '\\n') return '\n';
                if (m === '\\r') return '\r';
                if (m === '\\t') return '\t';
                if (m === '\\\\') return '\\';
                return m;
              }
            );
          }

          function inject(data) {
            const term = getTerm();
            if (!term?._core?.coreService?.triggerDataEvent) {
              console.warn("term not ready for triggerDataEvent");
              return;
            }
            // true => wasUserInput (so it follows normal input flow)
            term._core.coreService.triggerDataEvent(data, true);
          }

          function clickHandler(ev) {
            const btn = ev.target.closest("button");
            if (!btn) return;

            const s = btn.getAttribute("data-inject");
            if (s != null) {
              inject(s);
              return;
            }

            const t = btn.getAttribute("data-trace");
            if (t) {
              if (t === "start") traceStart();
              else if (t === "log") traceLog();
              return;
            }

            const del = btn.getAttribute("data-del");
            if (del != null) {
              const nEl = document.getElementById("dev-del-n");
              let n = 1;
              if (nEl && typeof nEl.value === "string") {
                n = Math.max(1, Math.min(64, parseInt(nEl.value || "1", 10) || 1));
              }
              inject("\x7f".repeat(n));
              return;
            }

            const action = btn.getAttribute("data-action");
            if (action) {
              const seq = currentProfile?.[action];
              if (!seq) {
                console.warn(`no sequence for action=${action} in profile=${currentShell}`);
                return;
              }
              inject(seq);
              return;
            }
          }

          function wireUp() {
            const root = document.getElementById("dev-inject");
            if (!root) return;
            root.addEventListener("click", clickHandler);

            initShellProfileFromUI();
          }

          function traceStart() {
            const rep = window.sockReporter;
            if (!rep) { console.warn("sockReporter not installed"); return; }
            rep.start();
          }

          function traceLog() {
            const rep = window.sockReporter;
            if (!rep) { console.warn("sockReporter not installed"); return; }
            // big pasteable block
            console.log(rep.log.join("\n"));
          }

          // Wait until term appears; the bundle is defer-loaded so this is usually immediate,
          wireUp();
          let tries = 0;
          const t = setInterval(() => {
            tries++;
            if (getTerm()?._core?.coreService?.triggerDataEvent || tries > 200) clearInterval(t);
          }, 25);
        })();
      </script>


      <div class="banner-tabs"></div>
    </div>
    <div id="container">
      <div class="grid">
        <div id="terminal-container"></div>
      </div>
      <div id="sidebar" class="grid">
      </div>
    </div>
      <script src="dist/client-bundle.js" defer ></script>
    </body>
</html>
