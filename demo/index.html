<!doctype html>
<html>
  <head>
    <title>xterm.js demo</title>
    <!--
      WARNING: This demo is a barebones implementation designed for development and evaluation
      purposes only. It is definitely NOT production ready and does not aim to be so. Exposing the
      demo to the public as is would introduce security risks for the host.
    -->
    <link rel="shortcut icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/xterm.css" />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="banner">
      <span class="banner-title">xterm.js</span>


      <div id="dev-inject">
        <div class="dev-group" title="Socket trace">
          <button class="dev-btn dev-btn-text" data-trace="start" title="Clear + start socket trace">trace start</button>
          <button class="dev-btn dev-btn-text" data-trace="log" title="Dump trace to console">trace log</button>
        </div>
        <span class="dev-sep" aria-hidden="true">|</span>
        <div class="dev-group" title="Inject test strings (typed, not pasted)">
          <button class="dev-btn" data-inject="ABC🙂" title="ABC🙂">🙂</button>
          <button class="dev-btn" data-inject="ABC👨‍🌾" title="ABC👨‍🌾">👨‍🌾</button>
          <button class="dev-btn" data-inject="ABC👨‍👩‍👧‍👦" title="ABC👨‍👩‍👧‍👦">👨‍👩‍👧‍👦</button>
          <button class="dev-btn" data-inject="ABC🇺🇳" title="ABC🇺🇳">🇺🇳</button>
        </div>
        <span class="dev-sep" aria-hidden="true">|</span>
        <div class="dev-group" title="Key ops (stdin)">
          <!-- DEL bursts -->
          <div class="dev-group" title="Send DEL (0x7F) burst">
            <input
              id="dev-del-n" class="dev-num"
              type="number"
              min="1" max="64"
              step="1" value="1"
              inputmode="numeric"
              title="DEL repeat count"
            />
            <button class="dev-btn dev-btn-text" data-del="1" title="Send DEL × N">DEL</button>
          </div>

          <button class="dev-btn dev-btn-text" data-send="\x1b" title="Escape">ESC</button>
          <!-- "\x1b[H\x1b[1;5F"
          "\x1b[H\x1b[4;5~" -->

          <span class="dev-sep" aria-hidden="true">|</span>

          <button class="dev-btn dev-btn-text" data-send="\x1b[D" title="Left arrow">←</button>
          <button class="dev-btn dev-btn-text" data-send="\x1b[C" title="Right arrow">→</button>
          <button class="dev-btn dev-btn-text" data-send="\x1b[H" title="Home">HOME</button>
          <button class="dev-btn dev-btn-text" data-send="\x1b[F" title="End">END</button>

        </div>

      </div>

      <style>
        /* dev-only; feel free to move to index.css */
        #dev-inject {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          margin-left: 10px;
          user-select: none;
        }
        #dev-inject .dev-group { display: inline-flex; gap: 6px; align-items: center; }
        #dev-inject .dev-sep { opacity: 0.5; }
        #dev-inject .dev-btn {
          font: inherit;
          line-height: 1;
          padding: 2px 6px;
          border-radius: 6px;
          border: 1px solid rgba(255,255,255,0.25);
          background: rgba(255,255,255,0.06);
          color: inherit;
          cursor: pointer;
        }
        #dev-inject .dev-btn:hover { background: rgba(255,255,255,0.12); }
        #dev-inject .dev-btn:active { transform: translateY(1px); }
        #dev-inject .dev-btn-text { font-size: 12px; padding: 3px 7px; }

        #dev-inject .dev-num{
          width: 52px;
          font: inherit;
          font-size: 12px;
          line-height: 1;
          padding: 2px 6px;
          border-radius: 6px;
          border: 1px solid rgba(255,255,255,0.25);
          background: rgba(255,255,255,0.06);
          color: inherit;
          outline: none;
        }
        #dev-inject .dev-num:focus{
          border-color: rgba(255,255,255,0.45);
          background: rgba(255,255,255,0.10);
        }

      </style>

      <script>
        (function () {
          function getTerm() {
            // You said window.term exists; keep this flexible.
            return window.term || window._term || null;
          }

          function unescapeBytes(s) {
            // Supports \xHH, \uHHHH, \n, \r, \t, \\.
            return s.replace(
              /\\x([0-9a-fA-F]{2})|\\u([0-9a-fA-F]{4})|\\n|\\r|\\t|\\\\/g,
              (m, hx, hu) => {
                if (hx) return String.fromCharCode(parseInt(hx, 16));
                if (hu) return String.fromCharCode(parseInt(hu, 16));
                if (m === '\\n') return '\n';
                if (m === '\\r') return '\r';
                if (m === '\\t') return '\t';
                if (m === '\\\\') return '\\';
                return m;
              }
            );
          }

          function inject(data) {
            const term = getTerm();
            if (!term?._core?.coreService?.triggerDataEvent) {
              console.warn("term not ready for triggerDataEvent");
              return;
            }
            // true => wasUserInput (so it follows normal input flow)
            term._core.coreService.triggerDataEvent(data, true);
          }

          function clickHandler(ev) {
            const btn = ev.target.closest("button");
            if (!btn) return;

            const s = btn.getAttribute("data-inject");
            if (s != null) {
              inject(s);
              return;
            }

            const t = btn.getAttribute("data-trace");
            if (t) {
              if (t === "start") traceStart();
              else if (t === "log") traceLog();
              return;
            }

            const del = btn.getAttribute("data-del");
            if (del != null) {
              const nEl = document.getElementById("dev-del-n");
              let n = 1;
              if (nEl && typeof nEl.value === "string") {
                n = Math.max(1, Math.min(64, parseInt(nEl.value || "1", 10) || 1));
              }
              inject("\x7f".repeat(n));
              return;
            }

            const send = btn.getAttribute("data-send");
            if (send != null) {
              inject(unescapeBytes(send));
              return;
            }
          }

          function wireUp() {
            const root = document.getElementById("dev-inject");
            if (!root) return;
            root.addEventListener("click", clickHandler);
          }

          function traceStart() {
            const rep = window.sockReporter;
            if (!rep) { console.warn("sockReporter not installed"); return; }
            rep.start();
          }

          function traceLog() {
            const rep = window.sockReporter;
            if (!rep) { console.warn("sockReporter not installed"); return; }
            // big pasteable block
            console.log(rep.log.join("\n"));
          }

          // Wait until term appears; the bundle is defer-loaded so this is usually immediate,
          wireUp();
          let tries = 0;
          const t = setInterval(() => {
            tries++;
            if (getTerm()?._core?.coreService?.triggerDataEvent || tries > 200) clearInterval(t);
          }, 25);
        })();
      </script>


      <div class="banner-tabs"></div>
    </div>
    <div id="container">
      <div class="grid">
        <div id="terminal-container"></div>
      </div>
      <div id="sidebar" class="grid">
      </div>
    </div>
      <script src="dist/client-bundle.js" defer ></script>
    </body>
</html>
